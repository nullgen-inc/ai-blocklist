name: Update lists

on:
    schedule:
        - cron: "17 6 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Regenerate lists from the Nullgen catalog
              run: node scripts/generate.mjs

            - name: Commit when the catalog changed
              run: |
                  if git diff --quiet; then
                      echo "No changes."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "Update lists from catalog ($(date -u +%Y-%m-%d))"
                  git push
